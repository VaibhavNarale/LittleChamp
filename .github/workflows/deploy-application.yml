        id: sshkey
        env:
          EMBEDDED_KEY: ${{ matrix.server.key }}
          HOST: ${{ matrix.server.ip }}
          SSH_USER: ${{ matrix.server.username }}
          SSH_PORT: ${{ matrix.server.port }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          SP_API: ${{ vars.SERVERPILOT_API_URL }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          KEY_FILE="$RUNNER_TEMP/sp_deploy_key"
          umask 077; : > "$KEY_FILE"
          EFFECTIVE_USER="$SSH_USER"
          echo "username=$EFFECTIVE_USER" >> "$GITHUB_OUTPUT"
