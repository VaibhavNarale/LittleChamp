        id: sshkey
        env:
          EMBEDDED_KEY: ${{ matrix.server.key }}
          HOST: ${{ matrix.server.ip }}
          SSH_USER: ${{ matrix.server.username }}
          SSH_PORT: ${{ matrix.server.port }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          SP_API: ${{ vars.SERVERPILOT_API_URL }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          KEY_FILE="$RUNNER_TEMP/sp_deploy_key"
          umask 077; : > "$KEY_FILE"
          EFFECTIVE_USER="$SSH_USER"
          echo "username=$EFFECTIVE_USER" >> "$GITHUB_OUTPUT"
          emit_key() {
            while IFS= read -r l; do [ -n "$l" ] && echo "::add-mask::$l"; done < "$KEY_FILE"
            { echo "key<<__SP_KEY_EOF__"; cat "$KEY_FILE"; echo "__SP_KEY_EOF__"; } >> "$GITHUB_OUTPUT"
          }
          if [ -z "${EMBEDDED_KEY:-}" ]; then
            echo "No embedded SSH key (password-auth host); skipping key fallback."
            exit 0
          fi
          printf '%s' "$EMBEDDED_KEY" > "$KEY_FILE"; chmod 600 "$KEY_FILE"
          ssh_ok() { ssh -i "$KEY_FILE" -p "${SSH_PORT:-22}" -o BatchMode=yes \
            -o StrictHostKeyChecking=no -o ConnectTimeout=10 "${EFFECTIVE_USER}@${HOST}" true 2>/dev/null; }
          if ssh_ok; then echo "Embedded deploy key OK."; emit_key; exit 0; fi
          if [ -z "${DEPLOY_TOKEN:-}" ]; then
            echo "::warning::Embedded key failed and no DEPLOY_TOKEN secret set — cannot fall back to vault."
            emit_key
            exit 0
          fi
          echo "Embedded key failed — requesting current key from ServerPilot vault (host-local call)."
          API="${SP_API:-https://api.serverpilot.aaibuzz.com}"
          RESP="$(curl -s -L -X POST "$API/api/deploy/resolve-key" \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            -H "Content-Type: application/json" -H "Accept: application/json" \
            -d "{\"host\":\"$HOST\",\"repo\":\"${REPO:-}\"}")"
          if [ "$(printf '%s' "$RESP" | jq -r '.data.type // empty')" = "ssh_key" ]; then
            printf '%s' "$RESP" | jq -r '.data.key' > "$KEY_FILE"; chmod 600 "$KEY_FILE"
            NEW_USER="$(printf '%s' "$RESP" | jq -r '.data.username // empty')"
            if [ -n "$NEW_USER" ] && [ "$NEW_USER" != "$EFFECTIVE_USER" ]; then
              echo "ServerPilot switched deploy user: '$EFFECTIVE_USER' -> '$NEW_USER'."
              EFFECTIVE_USER="$NEW_USER"
              echo "username=$EFFECTIVE_USER" >> "$GITHUB_OUTPUT"
            fi
            if ssh_ok; then echo "Recovered via vault key (user: $EFFECTIVE_USER)."; emit_key; else echo "::error::Vault key also failed for $HOST"; exit 1; fi
          else
            echo "::error::resolve-key returned no ssh_key for $HOST"
            exit 1
          fi

      - name: Runs before hooks
        uses: appleboy/ssh-action@master
        env:
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_PATH: ${{ matrix.server.path }}/releases/${{ github.sha }}
          ACTIVE_PATH: ${{ matrix.server.path }}/current
          STORAGE_PATH: ${{ matrix.server.path }}/storage
          BASE_PATH: ${{ matrix.server.path }}
        with:
          host: ${{ matrix.server.ip }}
          username: ${{ steps.sshkey.outputs.username }}
          key: ${{ steps.sshkey.outputs.key }}
          port: ${{ matrix.server.port }}
          envs: GITHUB_SHA, RELEASE_PATH, ACTIVE_PATH, STORAGE_PATH, BASE_PATH
          script: |
            ${{ matrix.server.beforeHooks }}

  activate-release:
    name: "${{ matrix.server.name }}: Activate release"
    runs-on: self-hosted
    needs:
      [create-deployment-artifacts, prepare-release-on-server, run-before-hooks]
    strategy:
      matrix:
        server: ${{ fromJson(needs.create-deployment-artifacts.outputs.DEPLOYMENT_MATRIX) }}
    steps:
      - name: Mask deploy key in logs
        env:
          DEPLOYMENT_CONFIG: ${{ secrets.DEPLOYMENT_CONFIG }}
        run: |
          printf '%s' "${DEPLOYMENT_CONFIG:-}" \
            | jq -r '(if type=="array" then .[] else . end) | .key // empty' 2>/dev/null \
